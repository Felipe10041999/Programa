<div class="registrar-container">
    <div class="registrar-content">
        <div class="registrar-header">
            <h2><i class="fas fa-user-plus"></i> Registrar nuevo usuario</h2>
            <p>Complete todos los campos para crear un nuevo usuario de BestVoIper</p>
        </div>

        <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="registrar-form">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"></i> Nombre del usuario
                    </label>
                    <input 
                    type="text"
                    class="form-input"
                    formControlName="nombre_usuario"
                    placeholder="Ingrese el  nombre de Usuario">
                    <span class="error-message" *ngIf="registroForm.get('nombre_usuario')?.invalid && registroForm.get('nombre_usuario')?.touched">
                        El nombre de usuario es obligatorio
                    </span>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-phone-volume"></i> Extensión
                    </label>
                    <input 
                    type="text"
                    class="form-input"
                    formControlName="extension"
                    placeholder="Ingrese el numero de extension">
                    <span class="error-message" *ngIf="registroForm.get('extension')?.invalid && registroForm.get('extension')?.touched">
                        El número de extension es obligatorio
                    </span>
                </div>
                </div>

                <div class="form-row">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user-edit"></i> Usuario
                    </label>
                    <input 
                    type="text"
                    class="form-input"
                    formControlName="usuario"
                    placeholder="Ingrese el usuario de BestVoIper">
                    <span class="error-message" *ngIf="registroForm.get('usuario')?.invalid && registroForm.get('usuario')?.touched">
                        El usuario es obligatorio
                    </span>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i> Contraseña 
                    </label>
                    <input 
                    type="text"
                    class="form-input"
                    formControlName="clave"
                    placeholder="Ingrese la clave del usuario">
                    <span class="error-message" *ngIf="registroForm.get('clave')?.invalid && registroForm.get('clave')?.touched">
                        La clave del usuario es obligatoria
                    </span>
                </div>
                </div>

            <div class="button-container">
                <button type="submit" class="btn-registrar" [disabled]="registroForm.invalid">
                    <i class="fas fa-save"></i> Registar usuario
                </button>
                <button type="buttom" class="btn-cancelar" (click)="cancelarRegistro()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
